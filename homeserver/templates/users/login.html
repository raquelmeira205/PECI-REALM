<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RADAR PROJECT - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind = { config: { darkMode: "class" } };
    </script>
    <script>
      function initDarkMode() {
        const htmlEl = document.documentElement;
        const currentTheme = localStorage.getItem("theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (currentTheme === "dark") {
          htmlEl.classList.add("dark");
        } else {
          htmlEl.classList.remove("dark");
        }
      }
      function toggleTheme() {
          const htmlEl = document.documentElement;
          if (htmlEl.classList.contains("dark")) {
              htmlEl.classList.remove("dark");
              localStorage.setItem("theme", "light");
          } else {
              htmlEl.classList.add("dark");
              localStorage.setItem("theme", "dark");
          }
      }
      initDarkMode();
    </script>
    <style>
      .wizard-card { box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1); }
      :root.dark .wizard-card { box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
      .input-field { transition: all 0.3s ease; }
      .input-field:focus { transform: translateY(-2px); }
      @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .animate-slide-in { animation: slideIn 0.4s ease; }
      :root.dark body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f1f5f9; }
      
      input[type="text"], input[type="email"], input[type="password"] {
        width: 100%;
        padding: 0.75rem 1rem;
        background-color: #f8fafc;
        border: 2px solid #e2e8f0;
        border-radius: 0.5rem;
        color: #0f172a;
        transition: all 0.3s ease;
      }
      :root.dark input[type="text"], :root.dark input[type="email"], :root.dark input[type="password"] {
        background-color: #334155;
        border-color: #475569;
        color: #f1f5f9;
      }
      input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus {
        outline: none;
        border-color: #10b981;
        box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
      }
      .errorlist { color: #ef4444; font-size: 0.875rem; list-style-type: none; padding: 0; margin-top: 0.25rem; }
    </style>
  </head>
  <body class="bg-gradient-to-br from-slate-50 to-slate-200 dark:from-slate-900 dark:to-slate-800 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">
    <div class="fixed top-4 right-4 z-50">
        <button onclick="toggleTheme()" class="p-2 bg-white dark:bg-slate-700 rounded-full shadow-lg text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors focus:outline-none border border-slate-200 dark:border-slate-600">
            <svg class="w-5 h-5 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" clip-rule="evenodd"></path></svg>
            <svg class="w-5 h-5 block dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
        </button>
    </div>

    <div class="w-full max-w-5xl animate-slide-in my-8">
      <div class="wizard-card bg-white dark:bg-slate-800 rounded-3xl flex flex-col lg:flex-row-reverse overflow-hidden border border-slate-200 dark:border-slate-700 min-h-[600px]">
        
        <!-- Right Banner (Branding) -->
        <div class="hidden lg:flex lg:w-5/12 bg-emerald-800 relative flex-col justify-center items-center p-12 overflow-hidden">
            <!-- Abstract Radar Circles -->
            <div class="absolute inset-0 flex items-center justify-center opacity-20 pointer-events-none">
                <div class="absolute w-[800px] h-[800px] rounded-full border border-emerald-400"></div>
                <div class="absolute w-[600px] h-[600px] rounded-full border border-emerald-400"></div>
                <div class="absolute w-[400px] h-[400px] rounded-full border border-emerald-400"></div>
                <div class="absolute w-[200px] h-[200px] rounded-full border border-emerald-400 bg-emerald-600/50"></div>
            </div>
            
            <!-- Central Icon/Logo -->
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-24 h-24 bg-white/10 backdrop-blur-md rounded-3xl flex items-center justify-center border border-white/20 shadow-2xl mb-6">
                    <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-white tracking-widest uppercase">Radar Project</h2>
            </div>
        </div>

        <!-- Left Side (Form) -->
        <div class="w-full lg:w-7/12 p-8 md:p-12 lg:p-16 flex flex-col justify-center">
            <div class="mb-10">
                <h1 class="text-3xl font-bold text-slate-900 dark:text-white">Bem-vindo de volta</h1>
                <p class="text-slate-500 dark:text-slate-400 mt-2">Insira as suas credenciais para aceder à plataforma.</p>
            </div>

            <form method="POST" class="space-y-6">
                {% csrf_token %}
                
                {% if form.non_field_errors %}
                <div class="p-4 bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 rounded text-red-700 dark:text-red-400 text-sm">
                    {{ form.non_field_errors }}
                </div>
                {% endif %}

                <div>
                    <label class="block text-sm font-semibold text-slate-900 dark:text-slate-200 mb-2">Email</label>
                    <input type="text" name="username" required
                        class="input-field w-full px-5 py-4 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition-all outline-none">
                    {{ form.username.errors }}
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-900 dark:text-slate-200 mb-2">Palavra-passe</label>
                    <input type="password" name="password" required
                        class="input-field w-full px-5 py-4 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition-all outline-none">
                    {{ form.password.errors }}
                </div>

                <div class="flex items-center justify-between mt-6">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" 
                            class="w-5 h-5 text-emerald-600 focus:ring-emerald-500 border-slate-300 rounded bg-white dark:bg-slate-800">
                        <label for="remember-me" class="ml-3 block text-sm font-medium text-slate-700 dark:text-slate-300">Lembrar-me</label>
                    </div>

                    <div class="text-sm">
                        <a href="#" class="font-bold text-emerald-600 dark:text-emerald-400 hover:underline">Esqueceu-se da palavra-passe?</a>
                    </div>
                </div>

                <button type="submit" class="mt-10 w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-4 px-6 rounded-xl transition-all duration-200 transform hover:shadow-lg hover:-translate-y-0.5 flex items-center justify-center gap-2">
                    <span>Entrar no Dashboard</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
                
                <div class="pt-8 mt-8 border-t border-slate-200 dark:border-slate-700 text-center text-sm text-slate-500 dark:text-slate-400 font-medium">
                    Novo por aqui? <a href="{% url 'signup' %}" class="text-emerald-600 dark:text-emerald-400 hover:underline">Criar uma conta agora</a>
                </div>
            </form>
        </div>
      </div>
    </div>
  </body>
</html>
