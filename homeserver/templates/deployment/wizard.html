<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RADAR PROJECT - Setup</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind = { config: { darkMode: "class" } };
      function initDarkMode() {
        const currentTheme = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.toggle("dark", currentTheme === "dark");
      }
      function toggleTheme() {
          const isDark = document.documentElement.classList.toggle("dark");
          localStorage.setItem("theme", isDark ? "dark" : "light");
      }
      initDarkMode();
    </script>
    <style>
      .wizard-card { box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1); }
      :root.dark .wizard-card { box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
      .input-field { transition: all 0.3s ease; }
      .input-field:focus { transform: translateY(-2px); }
      @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .animate-slide-in { animation: slideIn 0.4s ease; }
      :root.dark body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f1f5f9; }
    </style>
  </head>
  <body class="bg-gradient-to-br from-slate-50 to-slate-200 dark:from-slate-900 dark:to-slate-800 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">
    <div class="fixed top-4 right-4 z-50">
        <button onclick="toggleTheme()" class="p-2 bg-white dark:bg-slate-700 rounded-full shadow-lg text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors focus:outline-none border border-slate-200 dark:border-slate-600">
            <svg class="w-5 h-5 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" clip-rule="evenodd"></path></svg>
            <svg class="w-5 h-5 block dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
        </button>
    </div>

    <div class="w-full max-w-6xl animate-slide-in my-8">
      <div class="wizard-card bg-white dark:bg-slate-800 rounded-3xl flex flex-col overflow-hidden border border-slate-200 dark:border-slate-700 min-h-[600px]">
        
        <!-- Top Navbar Banner -->
        <div id="wizard-top-banner" class="w-full bg-emerald-800 relative flex flex-row justify-between items-center px-8 py-6 overflow-hidden">
            <div class="absolute inset-0 flex items-center justify-center opacity-20 pointer-events-none">
                <div class="absolute w-[800px] h-[800px] rounded-full border border-emerald-400 -top-64"></div>
                <div class="absolute w-[600px] h-[600px] rounded-full border border-emerald-400 -top-48"></div>
                <div class="absolute w-[400px] h-[400px] rounded-full border border-emerald-400 bg-emerald-600/50 -top-32"></div>
            </div>
            <div class="relative z-10 flex flex-row items-center gap-4">
                <div class="w-12 h-12 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center border border-white/20 shadow-lg">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-white tracking-widest uppercase">Radar Setup</h2>
            </div>
        </div>

        <!-- HTMX Container -->
        <div class="w-full p-8 md:p-10 lg:p-12 flex flex-col flex-grow" id="wizard-content" hx-get="{% if request.GET.step == '2' %}/deployment/api/step2/{% else %}/deployment/api/step1/{% endif %}" hx-trigger="load">
            <div class="flex justify-center items-center h-full min-h-[400px]">
                <svg class="animate-spin h-10 w-10 text-emerald-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
        </div>

      </div>
    </div>
    
    <script>
        document.body.addEventListener('htmx:configRequest', (event) => {
            const csrfMatch = document.cookie.match(/csrftoken=([^;]+)/);
            if (csrfMatch) event.detail.headers['X-CSRFToken'] = csrfMatch[1];
        });
    </script>
  </body>
</html>
