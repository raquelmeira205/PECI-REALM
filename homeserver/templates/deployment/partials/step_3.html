<div class="animate-slide-in flex flex-col">
  <!-- Progress Bar -->
<div class="mb-6 w-full">
  <div class="flex flex-row items-center justify-between gap-2 text-xs font-semibold uppercase tracking-wide w-full overflow-x-auto pb-2 custom-scrollbar">
    <button hx-get="/deployment/api/step1/" hx-target="#wizard-content" class="px-3 py-1.5 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 rounded-lg hover:bg-emerald-100 dark:hover:bg-emerald-800/60 transition-colors border border-emerald-200 dark:border-emerald-700/50 flex items-center gap-2 shadow-sm cursor-pointer">
  <div class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] font-bold">✓</div>
  <span>Habitação</span>
</button>
    <div class="hidden md:block flex-grow h-px bg-slate-300 dark:bg-slate-600 mx-2"></div>
    <button hx-get="/deployment/api/step2/" hx-target="#wizard-content" class="px-3 py-1.5 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 rounded-lg hover:bg-emerald-100 dark:hover:bg-emerald-800/60 transition-colors border border-emerald-200 dark:border-emerald-700/50 flex items-center gap-2 shadow-sm cursor-pointer">
  <div class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] font-bold">✓</div>
  <span>Divisões</span>
</button>
    <div class="hidden md:block flex-grow h-px bg-slate-300 dark:bg-slate-600 mx-2"></div>
    <div class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg border border-emerald-500 flex items-center gap-2 shadow-md">
  <div class="w-5 h-5 rounded-full bg-white text-emerald-600 flex items-center justify-center text-[11px] font-bold">3</div>
  <span>Radares</span>
</div>
  </div>
</div>
<!-- End Progress Bar -->

  <div class="mb-6">
    <h1 class="text-3xl font-bold text-slate-900 dark:text-white">
      Assistente de Hardware
    </h1>
    <p class="text-slate-500 dark:text-slate-400 mt-2">
      Associe radares às divisões. Selecione uma divisão para começar.
    </p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8 overflow-y-auto max-h-[400px] p-2 custom-scrollbar">
    {% for r in rooms %}
    <div
      class="p-5 bg-white dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl shadow-sm"
      id="room-card-{{ r.id }}"
    >
      <div class="flex items-center justify-between mb-4">
        <h3
          class="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2"
        >
          <svg
            class="w-5 h-5 text-emerald-500"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
            ></path>
          </svg>
          {{ r.name }}
        </h3>
      </div>

      <p
        class="text-sm text-slate-700 dark:text-slate-300 mb-4 bg-blue-50 dark:bg-blue-900/20 p-4 rounded-lg border-l-4 border-blue-500"
      >
        <strong>Instrução:</strong> Ligue o radar nesta divisão para
        associá-lo.
      </p>
      <button
        hx-get="/deployment/api/configure-room/{{ r.id }}/"
        hx-target="#wizard-content"
        class="w-full {% if r.has_master %}bg-slate-700 hover:bg-slate-600{% else %}bg-emerald-600 hover:bg-emerald-500{% endif %} text-white font-bold py-3 px-4 rounded-lg transition-all flex justify-center items-center gap-2"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 10V3L4 14h7v7l9-11h-7z"
          ></path>
        </svg>
        {% if r.has_master %}Adicionar outros radares{% else %}Adicionar Radar Master{% endif %}
      </button>
    </div>
    {% endfor %}
  </div>

  <button
    onclick="window.location.href='/dashboard/'"
    class="mt-auto w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-4 px-6 rounded-xl transition-all duration-200 transform hover:-translate-y-0.5 flex items-center justify-center gap-2"
  >
    <span>Concluir e ir para o Dashboard</span>
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
    </svg>
  </button>
</div>
