<div class="animate-slide-in flex flex-col h-full">
  <div class="mb-6 w-full">
    <div
      class="flex flex-row items-center justify-between gap-2 text-xs font-semibold uppercase tracking-wide w-full overflow-x-auto pb-2 custom-scrollbar">
      <button hx-get="/deployment/api/step1/" hx-target="#wizard-content"
        class="px-3 py-1.5 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 rounded-lg hover:bg-emerald-100 dark:hover:bg-emerald-800/60 transition-colors border border-emerald-200 dark:border-emerald-700/50 flex items-center gap-2 shadow-sm cursor-pointer">
        <div
          class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] font-bold">
          ✓</div>
        <span>Habitação</span>
      </button>
      <div class="hidden md:block flex-grow h-px bg-slate-300 dark:bg-slate-600 mx-2"></div>
      <button hx-get="/deployment/api/step2/" hx-target="#wizard-content"
        class="px-3 py-1.5 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 rounded-lg hover:bg-emerald-100 dark:hover:bg-emerald-800/60 transition-colors border border-emerald-200 dark:border-emerald-700/50 flex items-center gap-2 shadow-sm cursor-pointer">
        <div
          class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] font-bold">
          ✓</div>
        <span>Divisões</span>
      </button>
      <div class="hidden md:block flex-grow h-px bg-slate-300 dark:bg-slate-600 mx-2"></div>
      <div
        class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg border border-emerald-500 flex items-center gap-2 shadow-md">
        <div
          class="w-5 h-5 rounded-full bg-white text-emerald-600 flex items-center justify-center text-[11px] font-bold">
          3</div>
        <span>Radares</span>
      </div>
    </div>
  </div>

  <div class="text-center mt-8 mb-6">
    <div
      class="w-20 h-20 bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-full flex items-center justify-center mx-auto mb-6">
      <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    </div>
    <h1 class="text-3xl font-bold text-slate-900 dark:text-white">Instruções para o Alinhamento</h1>
    <p class="text-slate-500 dark:text-slate-400 mt-4 max-w-xl mx-auto font-medium text-lg">
      Terá de fazer uma movimento de reta - a partir do radar mestre, até a um dos slaves.
    </p>
  </div>

  <div
    class="bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl p-4 max-w-2xl mx-auto mb-8 w-full shadow-sm flex flex-col items-center">
    <img src="/static/img/calibration/alinhamento_slave.jpeg" alt="Ilustração do Alinhamento Slave"
      class="rounded-lg shadow-md max-h-64 object-contain w-full">
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-4 text-center">
      Caminhe em linha reta conforme ilustrado acima durante a fase de captura.
    </p>
  </div>

  <button hx-get="/deployment/api/sync-capture/{{ room.id }}/" hx-target="#wizard-content" hx-swap="innerHTML"
    class="max-w-md mx-auto w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-4 px-6 rounded-xl transition-all duration-200 transform hover:shadow-lg hover:-translate-y-0.5 flex items-center justify-center gap-2">
    <span>Entendi, avançar para a captura</span>
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
    </svg>
  </button>
</div>
