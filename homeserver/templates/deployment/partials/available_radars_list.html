{% for radar in available_radars %}
<div
  class="p-5 bg-gradient-to-r from-emerald-50 dark:from-emerald-900/20 to-green-50 dark:to-green-900/20 border-2 border-emerald-300 dark:border-emerald-700 rounded-xl hover:shadow-md dark:hover:shadow-lg transition-all"
>
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3 flex-1">
      <div class="p-3 bg-emerald-100 dark:bg-emerald-900 rounded-lg">
        <svg
          class="w-5 h-5 text-emerald-600 dark:text-emerald-400"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
          />
        </svg>
      </div>
      <div>
        <p class="font-bold text-slate-900 dark:text-white text-sm">
          Radar {{ radar.network_id }}
        </p>
        <div class="flex items-center gap-2 mt-1">
          <span
            class="inline-block w-2 h-2 bg-emerald-500 rounded-full animate-pulse"
          ></span>
          <span
            class="text-xs font-semibold text-emerald-700 dark:text-emerald-400"
            >Online e Disponível</span
          >
        </div>
      </div>
    </div>
    <form
      hx-post="/api/radar-assign/"
      hx-target="#wizard-content"
      hx-swap="innerHTML"
      class="ml-4"
    >
      {% csrf_token %}
      <input type="hidden" name="network_id" value="{{ radar.network_id }}" />
      <button
        type="submit"
        class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 dark:bg-emerald-600 dark:hover:bg-emerald-500 text-white font-bold py-2 px-5 rounded-lg transition-all duration-200 transform hover:shadow-lg hover:-translate-y-0.5 text-sm whitespace-nowrap flex items-center gap-2"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 10V3L4 14h7v7l9-11h-7z"
          />
        </svg>
        <span>Associar</span>
      </button>
    </form>
  </div>
</div>
{% empty %}
<div
  class="p-6 bg-amber-50 dark:bg-amber-900/20 border-2 border-amber-300 dark:border-amber-700 rounded-xl text-center"
>
  <div class="flex flex-col items-center gap-3">
    <svg
      class="w-12 h-12 text-amber-500 dark:text-amber-400"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M12 8v4m0 4v.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
      />
    </svg>
    <div>
      <p class="font-semibold text-amber-900 dark:text-amber-200 mb-1">
        Nenhum radar detectado
      </p>
      <p class="text-xs text-amber-700 dark:text-amber-300 max-w-xs">
        Verifique se o radar está ligado e tente novamente. O sistema procura a
        cada 3 segundos.
      </p>
    </div>
  </div>
</div>
{% endfor %}
