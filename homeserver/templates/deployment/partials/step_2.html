<div class="animate-slide-in flex flex-col">
    <!-- Progress Bar -->
<div class="mb-6 w-full">
  <div class="flex flex-row items-center justify-between gap-2 text-xs font-semibold uppercase tracking-wide w-full overflow-x-auto pb-2 custom-scrollbar">
    <button hx-get="/deployment/api/step1/" hx-target="#wizard-content" class="px-3 py-1.5 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 rounded-lg hover:bg-emerald-100 dark:hover:bg-emerald-800/60 transition-colors border border-emerald-200 dark:border-emerald-700/50 flex items-center gap-2 shadow-sm cursor-pointer">
  <div class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] font-bold">✓</div>
  <span>Habitação</span>
</button>
    <div class="hidden md:block flex-grow h-px bg-slate-300 dark:bg-slate-600 mx-2"></div>
    <div class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg border border-emerald-500 flex items-center gap-2 shadow-md">
  <div class="w-5 h-5 rounded-full bg-white text-emerald-600 flex items-center justify-center text-[11px] font-bold">2</div>
  <span>Divisões</span>
</div>
    <div class="hidden md:block flex-grow h-px bg-slate-300 dark:bg-slate-600 mx-2"></div>
    <div class="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500 rounded-lg border border-slate-200 dark:border-slate-700 flex items-center gap-2 opacity-70">
  <div class="w-5 h-5 rounded-full bg-slate-300 dark:bg-slate-600 text-slate-500 dark:text-slate-400 flex items-center justify-center text-[11px] font-bold">3</div>
  <span>Radares</span>
</div>
  </div>
</div>
<!-- End Progress Bar -->

  <div class="mb-6">
        <h1 class="text-3xl font-bold text-slate-900 dark:text-white">Gestor de Divisões</h1>
        <p class="text-slate-500 dark:text-slate-400 mt-2">Desenhe a estrutura da casa. Adicione as divisões sem necessidade de hardware presente.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
        <!-- Form Left -->
        <form hx-post="/deployment/api/step2/" hx-target="#wizard-content" class="space-y-4 bg-slate-50 dark:bg-slate-700/30 p-6 rounded-xl border border-slate-200 dark:border-slate-700 h-fit">
            <div>
                <label class="block text-sm font-semibold text-slate-900 dark:text-slate-200 mb-2">Nome (ex: Sala, Cozinha)</label>
                <input type="text" name="name" required class="input-field w-full px-4 py-3 bg-white dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-lg text-slate-900 dark:text-white outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-900 dark:text-slate-200 mb-2">Largura (m)</label>
                    <input type="number" step="0.1" min="0.1" name="width" required class="input-field w-full px-4 py-3 bg-white dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-lg text-slate-900 dark:text-white outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-900 dark:text-slate-200 mb-2">Profundidade (m)</label>
                    <input type="number" step="0.1" min="0.1" name="depth" required class="input-field w-full px-4 py-3 bg-white dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-lg text-slate-900 dark:text-white outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10">
                </div>
            </div>
            <button type="submit" class="w-full bg-slate-800 dark:bg-slate-600 hover:bg-slate-700 dark:hover:bg-slate-500 text-white font-bold py-3 px-4 rounded-lg transition-all shadow-md mt-2">
                + Adicionar Divisão
            </button>
        </form>

        <!-- List Right -->
        <div class="space-y-3 overflow-y-auto max-h-[320px] pr-2 custom-scrollbar flex flex-col">
            {% for r in rooms %}
                <div class="flex items-center justify-between p-4 bg-white dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-lg shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-emerald-100 dark:bg-emerald-900/30 flex items-center justify-center text-emerald-600 dark:text-emerald-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                        </div>
                        <div>
                            <p class="font-bold text-slate-900 dark:text-white">{{ r.name }}</p>
                            <p class="text-xs font-medium text-slate-500 dark:text-slate-400">Status: <span class="text-amber-500">Sem Monitorização</span></p>
                        </div>
                    </div>
                    <!-- Delete button -->
                    <button type="button" 
                            hx-delete="/deployment/api/room/{{ r.id }}/" 
                            hx-target="#wizard-content" 
                            hx-confirm="Tem a certeza que pretende eliminar a divisão '{{ r.name }}'?" 
                            class="text-red-500 hover:text-red-700 hover:bg-red-50 dark:hover:bg-red-900/30 p-2 rounded-lg transition-colors ml-4" title="Eliminar Divisão">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
            {% empty %}
                <div class="flex flex-col items-center justify-center h-full flex-grow text-center p-6 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-xl min-h-[200px]">
                    <svg class="w-12 h-12 text-slate-300 dark:text-slate-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <p class="text-slate-500 dark:text-slate-400 font-medium">Nenhuma divisão configurada ainda.</p>
                    <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">Preencha o formulário ao lado.</p>
                </div>
            {% endfor %}
        </div>
    </div>

    <button hx-get="/deployment/api/step3-intro/" hx-target="#wizard-content" class="mt-auto w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-4 px-6 rounded-xl transition-all duration-200 transform hover:-translate-y-0.5 flex items-center justify-center gap-2 {% if not rooms %}opacity-50 cursor-not-allowed pointer-events-none{% endif %}" {% if not rooms %}disabled{% endif %} title="{% if not rooms %}Adicione pelo menos uma divisão para avançar{% endif %}">
        <span>Avançar para Hardware</span>
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
    </button>
</div>
